name: Update portfolio

on:
  schedule:
    - cron: "37 22 * * 1-5"   # main run: 22:37 UTC, Monday to Friday, after US close
    - cron: "17 1 * * 2-6"    # backup run: 01:17 UTC the next morning, in case the first is delayed or skipped
  workflow_dispatch:           # adds a manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install yfinance pandas

      - name: Run tracker
        run: python scripts/update.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
